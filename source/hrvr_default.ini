; Heavy Rain VR mod - settings
; This file sits next to HeavyRain.exe. The installer never overwrites it.
; Changes take effect the next time the game starts.

[hrvr]
; stage=vr (default) plays in VR. Test ladder for a new build (docs/TEST_RUNS.md), each stage proves one thing:
;   observe = read-only logging, the game is unchanged
;   gate    = flat-screen stereo safety test: renders twice per frame for ~1 s, then reports
;   xrcolor = headset shows red (left eye) / blue (right eye): OpenXR transport only
;   xrflat  = headset shows the flat game image in both eyes: image path only
;   vr      = native stereo with head tracking
stage=vr

; xr stages only: on = VR starts by itself a few seconds after the game starts (SteamVR running)
; off = the game starts on your monitor; press F9 to switch VR on (and off again)
vr=on

; Where the game's 2D (menus, button prompts, subtitles) is shown in VR:
;   panel = a floating screen in front of you (recommended)
;   eyes  = drawn into the 3D picture like on the monitor (fallback if something is missing)
ui=panel

; Smaller views on screen (split screen, picture-in-picture, previews):
;   fixed = the game's own camera, the same picture in both eyes (default); a screen made only
;           of small panels is shown flat on the floating screen
;   head  = they follow your head and get 3D depth too, keeping their own field of view
small_views=fixed

; Controller buttons the game shows: xbox or playstation. F10 / F11 in game switch it and save it here.
; With playstation, prompts that need the controller's motion sensor read your right VR controller.
controller=xbox
; Motion sensor strength: Steam counts per g. Raise it if motion prompts trigger too easily,
; lower it if you have to shake the controller hard.
motion_counts_per_g=16384
; The game's controller rumble on the VR controllers (both hands): 1.0 = as the game sends it, 0.5 = half,
; 0 = off, up to 2.0.
rumble_strength=1.0

; Size of the eye offsets: engine units per metre. 1 = the game's world is in metres.
; If the world looks like a doll house (too small) raise it; if it looks gigantic lower it.
world_scale=1.0

; Diagnostics (leave as they are unless asked):
; prime     = on: set every viewport's camera up again before each eye (try if the left eye flickers)
; enginefov = on: the game's FOV values describe the headset's view (culling, level of detail)
; symfov    = on: render a symmetric frustum per eye (cropped back to the eye's own when submitted)
prime=off
enginefov=on
symfov=on

; force = find every game address by signature even on the verified build (testing).
signature_scan=off

; ---- First person (stage=vr only) ----
; F1 (or click both thumbsticks): first person while you walk the character.
; F3 (or hold both thumbsticks 0.8 s): first person in cutscenes, the view rides on the character's head.
; Both start off; the keys and thumbsticks switch them in game.
firstperson=off
fpcutscenes=off
; Right stick in F1: smooth (120 deg/s) or snap turns. The stick turns nothing while the game
; offers an action (its gestures are done with the right stick).
turn=smooth
snap_turn_degrees=45
; F1: the left stick walks where you look. Heavy Rain walks while R2 is held: on = the mod holds it
; for you while the left stick is pushed.
fp_autowalk=on
; Eye position from the head bone (metres, forward / up). Raise fp_eye_fwd if you see the inside of the head.
fp_eye_fwd=0.17
fp_eye_up=0.07
; F3 (cutscenes): the view sits between the character's own eyes (eye bones) and moves with the head. Forward (metres)
; along the view from there; raise it a little if you see the inside of the head in a cutscene.
fp_f3_eye_fwd=0
; F3: the view turns with where the character's face looks (face); torso = only with the body, lazily (calmer).
; fp_f3_pitch=on adds the character's head nods (off: the view stays level, your own head looks up and down).
fp_f3_follow=face
fp_f3_pitch=off
; Near clip distance in first person (metres; 0 = the game's own).
fp_near=0.05
; Thoughts and dialogue choices around the character's head move in front of you in first person.
fp_prompts=on

; ---- First-person body (stage=vr only) ----
; The body edits change only what is drawn; the game keeps the real pose for everything else.
; fp_body: off = the body is drawn exactly as the game animates it.
fp_body=on
; The head in first person (VR panel "Hide head"): collapse (default) = not drawn at all (eyes, teeth,
; hair and Madison's simulated hair too; mirrors still show it); off = drawn; clip = drawn, but nothing nearer than fp_head_clip
; (metres) in front of your eyes.
fp_hidehead=collapse
fp_head_clip=0.20
; F1: the drawn body turns with your view.
fp_turnbody=on
; F1: the drawn body moves with your headset (lean or step and the body goes with you; feet stay on the floor).
fp_body_follow=on
; F1: the VR controllers move the arms (the fingers move as the game animates them).
fparms=on
; on = after you perform an action prompt the game animates the hands for 3 s (off by default).
fp_arms_handover=off
; Hand tilt (degrees) if the drawn hands do not match how you hold the controllers. Without it, the
; headset's own key is used: wristpitch_psvr2 / wristpitch_quest / wristpitch_other (default 0).
;fp_wrist_pitch=0
; F5 / F6 tilt the drawn hands up / down by 5 degrees per press, saved for your headset.
; Wrist joint distance behind the controller's grip point (metres).
fp_wrist_back=0.07
; Steady drawn hands (the game still gets the raw controllers). This one also takes effect while the game
; runs: save the file and it applies within a second.
hand_smoothing=on

; ---- Picture, rendering and sound (0.5.0, stage=vr only) ----
; VR picture size (per eye): while the headset shows 3D, the game renders a square picture of this size.
; render_size_auto=on uses the headset's recommended size; off uses render_size (1440 .. 2816, or "game" for
; the game's own resolution). Videos, loading screens and VR off always use the game's own resolution.
; The VR settings panel changes it too. Your resolution in user_setting.ini is never changed.
render_size_auto=on
render_size=2048
; Rendering method: native (both eyes every frame), afr (one eye per frame, alternating: about half the
; render work), mono (one picture from the centre of the head for both eyes: the fastest, no 3D depth) or aer
; (one eye per frame, both eyes of a pair from the same head pose; not on the panel). Default native.
rendering_method=native
; AFR only: the eye not drawn this frame is turned to where your head is now, so headsets whose runtime ignores
; each eye's own pose (Quest Link, Virtual Desktop) do not shake. 2 = every runtime except SteamVR (default),
; 1 = always, 0 = never.
afr_reproject=2
; A fixed, invisible dither on the headset picture (+-0.5 of one colour step per pixel) against colour banding in
; streamed pictures (Virtual Desktop, Link). 1 = on, 0 = off.
xr_dither=1
; The game's lens flares (glows and rings from the sun and lamps) are flat screen effects that land in different
; places in your two eyes. off (default) = not drawn in the headset; on = drawn as on the monitor.
vr_lens_flares=off
; Third person: the game's camera moved this many metres closer to the character (as Beyond's VR mod). 0 = the
; game's own place; default 2; up to 5. Never closer than 0.75 m in front of the character. Also on the VR panel.
camera_forward=2
; The game's 3D sound follows your head (turn your head and sounds stay where they are in the world).
audio_head=on

; ---- 0.6.0 ----
; F1: while the character stands still the drawn body holds still too (the idle animation's sway is not drawn).
fp_idlehold=on
; Depth of field in the headset: off = no background blur (recommended in VR); on = as the game does it.
vr_dof=off
; Film grain (the game's moving noise) in the headset and the desktop window: off = a clean picture; on = as the game does it.
vr_film_grain=off
; The game's yellow colour filter (its colour gamma, darker blues): on = as the game looks (default); off = neutral
; colours, as the "No PP" mod. Also on the VR panel ("Yellow filter"), switched at once.
vr_yellow_filter=on
; Jayden's ARI glasses in first person (F1) with motion controls: squeeze the grip at your chest and bring the hand up
; to your eyes to put them on, squeeze it at your face and lower the hand to take them off (the game's semicircle prompt
; is not shown and the thumbstick does not answer it there). off = the game's own prompt everywhere.
; Hints ("Grab AR Glasses" / "Put on AR Glasses" / "Take off AR Glasses") show once per chapter; the mod remembers them
; in an [hrvr_ari_hints] section of this file (delete that section to see them again).
ari_gesture=on
; While VR runs the desktop window is a 16:9 window this many pixels high (720 = HD, 1280 x 720), in the middle of
; the screen; drag its edges or maximize it to resize it (it stays 16:9, and the size you choose is kept for the next
; time). 0 = keep your own window. The headset always gets its own full picture.
desktop_window=720
; The 3D view in the desktop window: 1 = cropped to fill it (no black bars), 0 = whole, with bars.
desktop_crop=1
; The VR settings panel shows while the game is paused and beside the game's own Options screens (also at the main
; menu): the menu pages it shows on (names or the start of names; every page change is in hrvr.log as MENU lines).
panel_pages=Option_Main,SOUND,VIDEO,Grahpics_Opt,CONTROLER,CONTROLLER_
; Mirrors and other reflections show your head while first person hides it from your own view.
fp_mirror_head=on
; 0.16.0: how the forearm skin follows a rolled wrist. helpers = the rig's two forearm roll bones share the twist
; by their place along the forearm (as the game does); forearm = the forearm bone rolls half the way (0.15.1 and older).
fp_forearm_twist=helpers
; 0.17.0: things in your hands. on = an object the game attaches to your character is drawn at the drawn
; (controller) hand, and one the animation brings to a tracked hand goes with it; off = objects stay where the
; game's animation has them (0.16.0 and older).
fp_items=on
; 0.31.0 / 0.33.0: things the game hands you with an animation only (the pizza box out of the fridge, a bottle): on =
; while the scene's animation carries one in a hand it is drawn in your controller hand (clothing, towels, bandages,
; folding paper, drawers and doors stay where the game puts them); off = it stays at the animated hand.
fp_items_loose=on
; 0.32.0: on = the drawn (controller) place of a held object is used only to draw it; the game's scripts, physics
; and its next animation keep reading the place the game's animation has it. off = as 0.31.0 and older.
fp_items_seam=on
; 0.21.0: simulated coats (Shelby, Jayden). on = in first person the coat is simulated on the drawn body (it follows
; the turned body and the controller arms); off = on the animated body. fp_cloth_reset=on starts the coat again from
; its resting shape when first person begins or ends.
fp_cloth=on
fp_cloth_reset=on
; 0.22.0: with fp_hidehead=collapse, simulated hair (Madison) is simulated out of sight instead of in front of your eyes.
fp_cloth_hair=on
; 0.22.0: fingers follow how you hold the controllers (grip, trigger and finger touch: point, fist; 1.0.3: the thumb follows the grip only).
; A hand that holds an item keeps the game's holding animation. off = the fingers move as the game animates them.
fp_fingers=on
; on = the fingers start from the character's resting hand shape (they never move by themselves); off = from the animation.
fp_fingers_rest_shape=on
; First person: all = every action prompt comes in front of you (prompts on objects keep their side as a small
; offset); player = only the prompts on your character.
fp_prompts_front=all
